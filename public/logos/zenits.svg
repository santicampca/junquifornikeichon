<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="england-circle">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>
  <g clip-path="url(#england-circle)">
    <rect x="0" y="0" width="100" height="100" fill="#ffffff"/>
    <rect x="40" y="0" width="20" height="100" fill="#CE1124"/>
    <rect x="0" y="40" width="100" height="20" fill="#CE1124"/>
  </g>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#1a1a2e" stroke-width="4"/>
  <!-- pequeño cañón "gunner" en la esquina, guiño a la identidad anterior -->
  <g fill="#1a1a2e">
    <circle cx="70" cy="72" r="9"/>
    <rect x="66" y="56" width="8" height="18" rx="3" transform="rotate(20 70 72)"/>
  </g>
</svg>
