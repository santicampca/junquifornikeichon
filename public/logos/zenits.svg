<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="zenits-circle">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>
  <g clip-path="url(#zenits-circle)">
    <rect x="0" y="0" width="100" height="100" fill="#9C824A"/>
    <rect x="0" y="0" width="100" height="100" fill="#EF0107" opacity="0.94"/>
  </g>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#1a1a2e" stroke-width="4"/>

  <!-- cañón "gunner" visto de perfil, apuntando a la izquierda -->
  <g stroke="#1a1a2e" stroke-width="1.4" stroke-linejoin="round">
    <!-- rueda trasera -->
    <circle cx="66" cy="66" r="11" fill="#2b2b2b"/>
    <circle cx="66" cy="66" r="6.5" fill="#F5C518"/>
    <circle cx="66" cy="66" r="1.8" fill="#2b2b2b" stroke="none"/>
    <line x1="66" y1="57.5" x2="66" y2="74.5"/>
    <line x1="57.5" y1="66" x2="74.5" y2="66"/>
    <line x1="60" y1="60" x2="72" y2="72"/>
    <line x1="72" y1="60" x2="60" y2="72"/>

    <!-- cureña -->
    <path d="M 40 62 L 66 62 L 66 70 L 44 70 Z" fill="#7a5c2e"/>

    <!-- cañón (tubo) apuntando hacia la izquierda-arriba -->
    <g transform="rotate(-14 55 55)">
      <rect x="18" y="49" width="42" height="13" rx="6.5" fill="#3a3a3a"/>
      <rect x="16" y="51" width="10" height="9" rx="4" fill="#F5C518"/>
      <circle cx="21" cy="55.5" r="3.2" fill="#1a1a2e" stroke="none"/>
    </g>
  </g>
</svg>
